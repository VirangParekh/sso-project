name: Deploy OpenAPI Docs to GitHub Pages

# Trigger the workflow on pushes to the main branch
on:
  push:
    branches:
      - main
    paths:
      - serverIam/docs/client-api-spec.yaml
  workflow_dispatch: # Allows you to run this manually from the Actions tab

# Sets permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static HTML from OpenAPI
        run: |
          mkdir -p dist
          # Adjust 'openapi.yaml' if your file has a different name or path
          npx @redocly/cli build-docs serverIam/docs/client-api-spec.yaml -o dist/sso/iam/client-spec/index.html
          
          # Optional: Copy the raw YAML so users can download it
          cp serverIam/docs/client-api-spec.yaml dist/sso/iam/client-spec/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
