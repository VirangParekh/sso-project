openapi: 3.0.3
info:
  title: IAM Server Unified API Specification (Primary & Supplementary)
  description: >
    Production OpenAPI 3.0 specification for the Custom IAM Server (Identity Provider).
    Covers Core OIDC/OAuth 2.0 PKCE protocols, User Account Management, MFA, Session Management,
    Dynamic Client Provisioning, Fine-Grained Authorization, and Single Logout (SLO).
  version: 2.1.0
servers:
  - url: https://iam.example.com
    description: Production IAM Server (Identity Provider - Stable Release)
  - url: https://iam-staging.example.com
    description: Staging IAM Server (Identity Provider - Rapid Update / Pre-Release)

tags:
  - name: Client - Core Protocol
    description: Core OIDC/OAuth 2.0 PKCE authorization, token issuance, userinfo, and revocation.
  - name: Client - Account & Recovery
    description: User self-registration, password reset, email verification, and profile management.
  - name: Client - Multi-Factor Auth (MFA)
    description: Secondary factor TOTP/WebAuthn enrollment and challenge verification.
  - name: Client - Device Sessions
    description: Active hardware session enumeration and remote refresh token revocation.
  - name: Resource Server - Core Metadata & Keys
    description: OIDC discovery metadata and bare JWKS public signing key publishing.
  - name: Resource Server - Introspection & Authz
    description: RFC 7662 token introspection, dynamic client registration, and ABAC evaluation.
  - name: Shared - Single Logout & Telemetry
    description: Front/Back-channel session teardown and security threat telemetry streams.

paths:
  # =========================================================================
  # CATEGORY 1: CLIENT INTERFACE - CORE OIDC / OAUTH 2.0 PROTOCOLS
  # =========================================================================

  /oauth2/authorize:
    get:
      summary: OAuth 2.0 / OIDC Authorization Endpoint (GET)
      description: Initiates browser-based login and issues PKCE authorization codes over https.
      tags:
        - Client - Core Protocol
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: "openid profile email"
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: nonce
          in: query
          required: false
          schema:
            type: string
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            enum: [none, login, consent, select_account]
      responses:
        '302':
          description: HTTP 302 Redirect containing authorization code and state.
        '400':
          $ref: '#/components/responses/OAuthBadRequest'

  /oauth2/token:
    post:
      summary: OAuth 2.0 / OIDC Token Endpoint
      description: Exchanges authorization code or refresh token for Access, ID, and Refresh Tokens.
      tags:
        - Client - Core Protocol
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TokenRequestAuthorizationCode'
                - $ref: '#/components/schemas/TokenRequestRefreshToken'
      responses:
        '200':
          description: Successful token issuance.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/OAuthBadRequest'
        '401':
          $ref: '#/components/responses/OAuthUnauthorized'

  /userinfo:
    get:
      summary: OpenID Connect UserInfo Endpoint
      description: Returns verified identity claims associated with the Bearer Access Token.
      tags:
        - Client - Core Protocol
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identity claims payload containing sub claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          $ref: '#/components/responses/OAuthUnauthorized'

  /oauth2/revoke:
    post:
      summary: Token Revocation Endpoint
      description: Revokes active tokens and triggers local Keystore/Keychain cleanup.
      tags:
        - Client - Core Protocol
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRevocationRequest'
      responses:
        '200':
          description: Token revoked successfully.
        '400':
          $ref: '#/components/responses/OAuthBadRequest'

  # =========================================================================
  # CATEGORY 2: CLIENT INTERFACE - ACCOUNT, RECOVERY, & MFA APIs
  # =========================================================================

  /api/v1/users/register:
    post:
      summary: User Self-Registration Endpoint
      description: Provisions new user accounts prior to executing PKCE login flows.
      tags:
        - Client - Account & Recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: User account successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountResponse'
        '400':
          $ref: '#/components/responses/OAuthBadRequest'

  /api/v1/users/me/password:
    post:
      summary: Self-Service Password Update Endpoint
      description: Updates user credentials using authenticated session tokens.
      tags:
        - Client - Account & Recovery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '200':
          description: Password updated successfully.
        '401':
          $ref: '#/components/responses/OAuthUnauthorized'

  /api/v1/auth/forgot-password:
    post:
      summary: Forgot Password Request Endpoint
      description: Generates an out-of-band password recovery token sent via email/SMS.
      tags:
        - Client - Account & Recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Password reset request accepted.

  /api/v1/auth/reset-password:
    post:
      summary: Password Reset Execution Endpoint
      description: Consumes recovery token to set new credentials.
      tags:
        - Client - Account & Recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully.
        '400':
          $ref: '#/components/responses/OAuthBadRequest'

  /api/v1/auth/verify-email:
    post:
      summary: Email Verification Endpoint
      description: Validates email verification token sent during onboarding.
      tags:
        - Client - Account & Recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '200':
          description: Email verified successfully.
        '400':
          $ref: '#/components/responses/OAuthBadRequest'

  /oauth2/mfa/enroll:
    post:
      summary: MFA Enrollment Endpoint
      description: Generates TOTP secret key / QR code or WebAuthn registration challenge.
      tags:
        - Client - Multi-Factor Auth (MFA)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentRequest'
      responses:
        '200':
          description: MFA challenge payload issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResponse'

  /oauth2/mfa/verify:
    post:
      summary: MFA Verification Endpoint
      description: Validates TOTP passcode or WebAuthn signature during authentication.
      tags:
        - Client - Multi-Factor Auth (MFA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerificationRequest'
      responses:
        '200':
          description: MFA challenge verified.
        '400':
          $ref: '#/components/responses/OAuthBadRequest'

  /api/v1/users/me/sessions:
    get:
      summary: Active Device Sessions Enumeration
      description: Returns list of active hardware device sessions for authenticated user.
      tags:
        - Client - Device Sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of active hardware session records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'

  /api/v1/users/me/sessions/{sessionId}:
    delete:
      summary: Remote Hardware Session Revocation
      description: Revokes specific device session and invalidates its stored Refresh Token.
      tags:
        - Client - Device Sessions
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked.
        '404':
          $ref: '#/components/responses/OAuthNotFound'

  # =========================================================================
  # CATEGORY 3: RESOURCE SERVER INTERFACE ENDPOINTS
  # =========================================================================

  /.well-known/openid-configuration:
    get:
      summary: OIDC Discovery Metadata Endpoint
      description: Exposes issuer config and endpoints for Spring Boot auto-configuration.
      tags:
        - Resource Server - Core Metadata & Keys
      responses:
        '200':
          description: OIDC Provider Metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDProviderConfiguration'

  /.well-known/jwks.json:
    get:
      summary: Public JSON Web Key Set (JWKS) Endpoint
      description: Publishes bare RS256 public keys for stateless backend JWT validation.
      tags:
        - Resource Server - Core Metadata & Keys
      responses:
        '200':
          description: Public signing key set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'

  /oauth2/introspect:
    post:
      summary: Token Introspection Endpoint (RFC 7662)
      description: Machine-to-machine endpoint checking active token status and claims.
      tags:
        - Resource Server - Introspection & Authz
      security:
        - ResourceServerBasicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenIntrospectionRequest'
      responses:
        '200':
          description: Active token claim payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIntrospectionResponse'
        '401':
          $ref: '#/components/responses/OAuthUnauthorized'

  /api/v1/clients:
    post:
      summary: Dynamic Client Registration (RFC 7591)
      description: Provisions new OAuth clients, redirect URIs, and allowed scope arrays.
      tags:
        - Resource Server - Introspection & Authz
      security:
        - ResourceServerBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'

  /oauth2/permissions/check:
    post:
      summary: Fine-Grained Authorization Evaluation (ABAC)
      description: Evaluates dynamic policy permissions for Resource Server requests.
      tags:
        - Resource Server - Introspection & Authz
      security:
        - ResourceServerBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCheckRequest'
      responses:
        '200':
          description: Authorization decision response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCheckResponse'

  /api/v1/events/jwks-rotation:
    post:
      summary: JWKS Key Rotation Webhook Trigger
      description: Pushes key rotation notification to invalidate Spring Boot local key caches.
      tags:
        - Resource Server - Core Metadata & Keys
      security:
        - ResourceServerBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRotationNotification'
      responses:
        '200':
          description: Notification acknowledged.

  # =========================================================================
  # CATEGORY 4: SHARED DUAL-INTERFACE APIs (SLO & TELEMETRY)
  # =========================================================================

  /oauth2/logout:
    get:
      summary: Front-Channel Single Logout (SLO) Endpoint
      description: Clears user session cookies and redirects to client post-logout URI.
      tags:
        - Shared - Single Logout & Telemetry
      parameters:
        - name: id_token_hint
          in: query
          required: true
          schema:
            type: string
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirected to post_logout_redirect_uri.

  /oauth2/backchannel-logout:
    post:
      summary: OIDC Back-Channel Logout Endpoint
      description: Sends out-of-band Logout Tokens to Spring Boot Resource Servers.
      tags:
        - Shared - Single Logout & Telemetry
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BackchannelLogoutRequest'
      responses:
        '200':
          description: Back-channel logout processed.

  /api/v1/security/telemetry:
    post:
      summary: Security Event Telemetry Ingestion Endpoint
      description: Ingests client/server security anomaly reports (jailbreak, rate abuse).
      tags:
        - Shared - Single Logout & Telemetry
      security:
        - BearerAuth: []
        - ResourceServerBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityTelemetryEvent'
      responses:
        '202':
          description: Security telemetry ingested.

# =========================================================================
# REUSABLE COMPONENTS & SCHEMAS
# =========================================================================

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ResourceServerBasicAuth:
      type: http
      scheme: basic

  responses:
    OAuthBadRequest:
      description: Invalid request parameters or protocol constraint violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuth2ErrorResponse'
          example:
            error: invalid_request
            error_description: "Missing required parameter: code_challenge."

    OAuthUnauthorized:
      description: Missing, expired, or invalid credentials/token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuth2ErrorResponse'
          example:
            error: invalid_token
            error_description: "The access token has expired."

    OAuthNotFound:
      description: Requested resource or session ID not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuth2ErrorResponse'
          example:
            error: not_found
            error_description: "Session ID does not exist."

  schemas:
    OAuth2ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid_grant
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_token
            - insufficient_scope
            - login_required
            - interaction_required
            - consent_required
            - not_found
            - server_error
        error_description:
          type: string
          example: "The authorization code has expired or was previously used."
        error_uri:
          type: string
          format: uri

    TokenRequestAuthorizationCode:
      type: object
      required:
        - grant_type
        - code
        - redirect_uri
        - client_id
        - code_verifier
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        client_id:
          type: string
        code_verifier:
          type: string

    TokenRequestRefreshToken:
      type: object
      required:
        - grant_type
        - refresh_token
        - client_id
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        client_id:
          type: string

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - id_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
        id_token:
          type: string
        scope:
          type: string

    UserInfoResponse:
      type: object
      required:
        - sub
      properties:
        sub:
          type: string
          example: "usr_9f83a21b4e"
        name:
          type: string
        email:
          type: string
          format: email

    TokenRevocationRequest:
      type: object
      required:
        - token
        - client_id
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [refresh_token, access_token]
        client_id:
          type: string

    UserRegistrationRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UserAccountResponse:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        status:
          type: string

    PasswordUpdateRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
        new_password:
          type: string

    EmailVerificationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    MfaEnrollmentRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [totp, webauthn]

    MfaEnrollmentResponse:
      type: object
      required:
        - secret_qr
      properties:
        secret_qr:
          type: string
        recovery_codes:
          type: array
          items:
            type: string

    MfaVerificationRequest:
      type: object
      required:
        - mfa_token
        - passcode
      properties:
        mfa_token:
          type: string
        passcode:
          type: string

    DeviceSession:
      type: object
      required:
        - session_id
        - device_os
        - ip_address
        - last_active
      properties:
        session_id:
          type: string
        device_os:
          type: string
          example: "Android 14"
        ip_address:
          type: string
        last_active:
          type: integer

    OpenIDProviderConfiguration:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string

    JWKSResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object

    TokenIntrospectionRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    TokenIntrospectionResponse:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
        sub:
          type: string
        scope:
          type: string

    ClientRegistrationRequest:
      type: object
      required:
        - client_name
        - redirect_uris
        - grant_types
      properties:
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string

    ClientRegistrationResponse:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: string
        client_secret:
          type: string

    PermissionCheckRequest:
      type: object
      required:
        - subject
        - resource
        - action
      properties:
        subject:
          type: string
        resource:
          type: string
        action:
          type: string

    PermissionCheckResponse:
      type: object
      required:
        - allowed
      properties:
        allowed:
          type: boolean
        reason:
          type: string

    KeyRotationNotification:
      type: object
      required:
        - event
        - kid
      properties:
        event:
          type: string
          example: "JWKS_ROTATION"
        kid:
          type: string

    BackchannelLogoutRequest:
      type: object
      required:
        - logout_token
      properties:
        logout_token:
          type: string

    SecurityTelemetryEvent:
      type: object
      required:
        - event_type
        - client_id
      properties:
        event_type:
          type: string
          example: "JAILBREAK_DETECTED"
        client_id:
          type: string
        details:
          type: string